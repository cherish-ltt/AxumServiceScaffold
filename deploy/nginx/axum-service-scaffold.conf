# 反向代理参考片段（nginx 1.24+）
#
# 用途：把应用放在 nginx 之后时的数值对齐与转发头设置。
# 说明：
#   - 本文件是参考片段，未在真实生产环境验证，请在预发环境核对后再上线；
#   - 所有容量参数都必须与应用 .env 中的同名参数对齐，见 docs/DEPLOYMENT.md；
#   - 应用只提供 HTTP/1.1 明文回源，代理必须使用 proxy_http_version 1.1；
#   - TLS/HSTS 由本层负责，应用侧只在确认全链路 HTTPS 后开启 MIDDLEWARE_HSTS_ENABLED。

# ── 与应用对齐的容量参数（按需调整，勿与 .env 漂移）──
# 与应用 SERVER_MAX_CONNECTIONS 对齐：单 IP 并发连接数
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
# 与应用 MIDDLEWARE_RATE_LIMIT_REQUESTS / MIDDLEWARE_RATE_LIMIT_PERIOD_SECS 同量级：单 IP 请求速率
limit_req_zone $binary_remote_addr zone=perip_req:10m rate=50r/s;
# 与应用 MIDDLEWARE_MAX_BODY_BYTES 对齐（默认 2m，代理侧不得小于应用侧）
client_max_body_size 2m;
# 与应用 MIDDLEWARE_MAX_URI_BYTES 同量级（单缓冲 8k，最多 4 个）
large_client_header_buffers 4 8k;
# 必须小于 SERVER_HTTP1_HEADER_READ_TIMEOUT_SECS（默认 30s），避免应用先超时断连
client_header_timeout 10s;
# 必须小于 SERVER_HTTP1_HEADER_READ_TIMEOUT_SECS，避免代理复用已被应用关闭的连接
keepalive_timeout 15s;
keepalive_requests 1000;

upstream axum_scaffold {
    server 127.0.0.1:8080;
    # 与应用 SERVER_MAX_CONNECTIONS 对齐：到上游的空闲长连接池大小
    keepalive 64;
    keepalive_timeout 15s;
}

# ── HTTP：仅用于跳转与 ACME 挑战 ──
server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：业务入口 ──
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/api.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 与应用 HTTP_ALLOWED_HOSTS 保持一致
    # （应用侧会再校验一次 Host，代理侧不接受未知域名可以把无效流量挡在前面）
    if ($host !~ ^(api\.example\.com)$) {
        return 421;
    }

    # 按 IP 的连接数与速率限制：多实例部署时由本层承担分布式限流语义
    limit_conn perip_conn 64;
    limit_req  zone=perip_req burst=100 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # 请求体与响应缓冲
    client_body_timeout 15s;
    send_timeout 30s;

    location / {
        proxy_pass http://axum_scaffold;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 转发头：应用只在直连对端命中 MIDDLEWARE_TRUSTED_PROXIES 时才采信这些值
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # 略大于 MIDDLEWARE_REQUEST_TIMEOUT_SECS，让应用先返回结构化错误
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    # 采集端点：建议只在内网监听，且不要让公网暴露 METRICS_TOKEN
    location = /metrics {
        # 内网放行示例：allow 10.0.0.0/8; deny all;
        proxy_pass http://axum_scaffold;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 抓取频率远低于 MIDDLEWARE_RATE_LIMIT_REQUESTS，必要时可单独放宽
    }

    # 存活/就绪探测：不经过限流，避免探测本身被限速
    location = /api/v1/system/health {
        access_log off;
        proxy_pass http://axum_scaffold;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /api/v1/system/ready {
        access_log off;
        proxy_pass http://axum_scaffold;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
