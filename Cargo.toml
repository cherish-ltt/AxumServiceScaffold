[package]
name = "axum-service-scaffold"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Guardian team"]
license = "MIT OR Apache-2.0"
description = "用于快速搭建 Axum + SeaORM 洋葱架构服务的 Rust 脚手架"
repository = "https://github.com/cherry-llt/Guardian"
keywords = ["axum", "swagger", "seaorm", "jwt", "scaffold"]
categories = ["web-programming", "development-tools"]

[features]
default = ["preset", "http-client"]
preset = [
  "dep:rayon",
  "dep:validator",
  "dep:regex",
  "dep:base64",
  "dep:once_cell",
  "dep:rand",
  "dep:derive_more",
  "dep:itertools",
]
http-client = ["dep:reqwest"]

[dependencies]
# 错误处理与抽象
anyhow = "=1.0.104"
async-trait = "=0.1.92"
thiserror = "=2.0.21"

# Web 框架与 HTTP 中间件
axum = { version = "=0.8.9", features = ["multipart"] }
mime = "=0.3"
tower-http = { version = "=0.7.1", features = ["cors", "trace", "request-id"] }

# 异步运行时与性能
tokio = { version = "=1.53.1", features = ["full"] }
mimalloc = "=0.1.52"
rayon = { version = "=1.12.0", optional = true }

# 配置、时间与基础工具
chrono = { version = "=0.4.45", features = ["serde"] }
dotenv = "=0.15"
once_cell = { version = "=1.21.4", optional = true }
rand = { version = "=0.10.3", optional = true }
regex = { version = "=1.13.1", optional = true }

# 数据序列化与参数校验
base64 = { version = "=0.23.1", optional = true }
sea-orm = { version = "=2.0.3", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
validator = { version = "=0.21.0", features = ["derive"], optional = true }

# 鉴权与密码学
argon2 = "=0.6.0"
jsonwebtoken = { version = "=11", features = ["aws_lc_rs"] }

# 可观测性
tracing = "=0.1"
tracing-subscriber = { version = "=0.3", features = [
  "env-filter",
  "fmt",
  "time",
  "local-time",
] }
tracing-appender = "=0.2.5"
time = { version = "=0.3.55", features = ["macros"] }

# OpenAPI 与调试文档
utoipa = "=6.0.0"
utoipa-swagger-ui = { version = "=10.0.1", features = ["axum", "vendored"] }

# 常用外部调用与标识工具
reqwest = { version = "=0.13.5", default-features = false, features = [
  "json",
  "rustls",
], optional = true }
uuid = { version = "=1.26.1", features = ["v4", "v7", "serde"] }

# ExtendTool
derive_more = { version = "=2.1.1", optional = true }
itertools = { version = "=0.15.0", optional = true }

# 开发依赖
[dev-dependencies]
# HTTP 服务与中间件测试工具
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
