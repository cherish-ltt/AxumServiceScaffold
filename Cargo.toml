[package]
name = "axum-service-scaffold"
version = "0.4.0"
edition = "2024"
authors = ["Guardian team"]
license = "MIT"
description = "用于快速搭建 Axum + SeaORM 洋葱架构服务的 Rust 脚手架"
repository = "https://github.com/cherry-llt/Guardian"
keywords = ["axum", "swagger", "seaorm", "jwt", "scaffold"]
categories = ["web-programming", "development-tools"]

[dependencies]
# 错误处理与抽象
anyhow = "1.0.104"
async-trait = "0.1.92"
thiserror = "2.0.20"

# Web 框架与 HTTP 中间件
axum = { version = "0.8.9", features = ["multipart"] }
mime = "0.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "request-id"] }

# 异步运行时与性能
tokio = { version = "1.53.1", features = ["full"] }
mimalloc = "0.1.52"
rayon = "1.10"

# 配置、时间与基础工具
chrono = { version = "0.4.5", features = ["serde"] }
dotenv = "0.15"
once_cell = "1.21"
rand = { version = "=0.8.7"}
regex = "1.13.1"

# 数据序列化与参数校验
base64 = "0.23.1"
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
validator = { version = "0.21.0", features = ["derive"] }

# 鉴权与密码学
argon2 = "0.5.3"
jsonwebtoken = "11"

# 可观测性
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender = "0.2.5"
time = { version = "0.3.55", features = ["macros"] }

# OpenAPI 与调试文档
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# 常用外部调用与标识工具
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.25.0", features = ["v4", "v7", "serde"] }

# ExtendTool
derive_more = "2.1.1"
itertools = "0.15.0"